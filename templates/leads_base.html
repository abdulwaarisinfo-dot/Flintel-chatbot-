<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Flintel{% endblock %} · Flintel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#171615; --panel:#1f1e1d; --line:#3d3d3b; --text:#e8e7e5; --muted:#a8a8a5; --lime:#C1FB3B; --warn:#d9a441; --bad:#e5786d; }
  * { box-sizing: border-box; }
  html { font-family: 'Figtree', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  body { margin: 0; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .top { display:flex; align-items:center; gap:20px; padding:14px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { font-weight:700; font-size:18px; letter-spacing:.2px; color:#fff; }
  .nav { display:flex; gap:4px; flex-wrap:wrap; margin-left:8px; }
  .nav a { padding:8px 12px; border-radius:8px; color:var(--muted); font-weight:500; font-size:14.5px; }
  .nav a.on, .nav a:hover { background:var(--panel); color:#fff; }
  .who { margin-left:auto; color:var(--muted); font-size:13.5px; }
  main { max-width:980px; margin:0 auto; padding:28px 24px 64px; }
  h1 { font-size:28px; line-height:1.2; margin:0 0 6px; color:#fff; }
  h2 { font-size:18px; margin:30px 0 12px; color:#fff; }
  .sub { color:var(--muted); margin:0 0 22px; max-width:62ch; line-height:1.5; }
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:11px 18px; border-radius:10px; font-weight:600; font-size:15px; border:1px solid var(--line); background:var(--panel); color:#fff; cursor:pointer; min-height:44px; }
  .btn.primary { background:var(--lime); color:#111; border-color:var(--lime); }
  .btn.small { padding:7px 12px; min-height:36px; font-size:13.5px; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline:2px solid var(--lime); outline-offset:2px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat b { display:block; font-size:26px; color:#fff; }
  .stat span { color:var(--muted); font-size:13.5px; }
  label { display:block; font-weight:600; margin:16px 0 6px; font-size:14.5px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 6px; font-weight:400; }
  input[type=text], input[type=url], select, textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:#151413; color:var(--text); font:inherit; }
  textarea { min-height:88px; resize:vertical; }
  .err { color:var(--bad); font-size:13.5px; margin-top:5px; }
  .ok { color:var(--lime); }
  .warn { color:var(--warn); }
  .tag { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12.5px; font-weight:600; border:1px solid var(--line); color:var(--muted); margin-right:6px; }
  .tag.hp { background:var(--lime); color:#111; border-color:var(--lime); }
  .tag.rel { border-color:var(--lime); color:var(--lime); }
  .tag.rev { border-color:var(--warn); color:var(--warn); }
  .lead h3 { margin:0 0 6px; font-size:16.5px; color:#fff; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:13.5px; margin:6px 0; overflow-wrap:anywhere; }
  blockquote { margin:10px 0; padding:10px 14px; border-left:3px solid var(--lime); background:#151413; border-radius:0 8px 8px 0; overflow-wrap:anywhere; }
  .why { margin:8px 0 0; padding-left:18px; color:var(--muted); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .cov div { display:flex; gap:10px; padding:5px 0; flex-wrap:wrap; }
  .cov b { min-width:120px; }
  .empty { text-align:center; padding:36px 20px; color:var(--muted); }
  .empty h2 { margin-top:0; }
  .notice { border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:10px 14px; margin:12px 0; }
  .checks label { display:flex; gap:10px; align-items:center; font-weight:500; margin:8px 0; }
  .checks input { width:18px; height:18px; }
  .progress-bar { height:6px; border-radius:6px; background:#2b2a29; overflow:hidden; margin-top:14px; }
  .progress-bar span { display:block; height:100%; width:35%; background:var(--lime); border-radius:6px; animation:slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  @media (prefers-reduced-motion: reduce) { .progress-bar span { animation:none; width:100%; opacity:.5; } }
  @media (max-width:640px) { main { padding:20px 16px 56px; } .top { padding:12px 16px; } .who { display:none; } h1 { font-size:24px; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/leads">Flintel</a>
  <nav class="nav" aria-label="Main">
    <a href="/leads" class="{{ 'on' if nav == 'overview' }}">Overview</a>
    <a href="/leads/find" class="{{ 'on' if nav == 'find' }}">Find Leads</a>
    <a href="/leads/my" class="{{ 'on' if nav == 'my' }}">My Leads</a>
    <a href="/leads/profile" class="{{ 'on' if nav == 'profile' }}">Business Profile</a>
    <a href="/billing/upgrade">Plan</a>
  </nav>
  <span class="who">{{ user.email if user else '' }}</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
