{# Touch devices only (pointer: coarse): enlarge the tap area of small icon buttons WITHOUT moving anything. A transparent ::after extends the
   hit area; the visible size and layout are unchanged. Desktop (fine pointer) is untouched. #}
<style>
  @media (pointer: coarse) {
    #sessions-toggle, #mobile-sidebar-toggle, .fl-menu-btn, .session-item-menu, #chat-plan-pill-close, .msg-act-btn, #attach-btn, #platforms-btn { position: relative; }
    #sessions-toggle::after, #mobile-sidebar-toggle::after, .fl-menu-btn::after, .session-item-menu::after, #chat-plan-pill-close::after,
    #attach-btn::after, #platforms-btn::after, #welcome-close-btn::after { content: ""; position: absolute; inset: -10px; }
    .msg-act-btn::after { content: ""; position: absolute; inset: -6px; }
  }
</style>
